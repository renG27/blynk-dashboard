<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Monitoring Banjir</title>
    <style>
        :root { --safe: #2ecc71; --danger: #e74c3c; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .header { margin-bottom: 20px; text-align: center; }
        .btn-audio { background: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 20px; font-weight: bold; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; width: 100%; max-width: 800px; }
        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center; transition: 0.3s; }
        .danger { background-color: var(--danger) !important; color: white !important; animation: pulse 1s infinite; }
        .value { font-size: 40px; font-weight: bold; margin: 10px 0; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>Monitoring Banjir OPSSII</h1>
        <button class="btn-audio" onclick="enableAudio()">🔊 Aktifkan Alarm Suara</button>
    </div>

    <div class="container">
        <div id="card-alert" class="card">
            <h3>Status</h3>
            <div class="value" id="v0">AMAN</div>
        </div>
        <div class="card">
            <h3>Tinggi Air</h3>
            <div class="value"><span id="v1">0</span><small> cm</small></div>
        </div>
        <div class="card">
            <h3>Jarak Sensor</h3>
            <div class="value"><span id="v2">0</span><small> cm</small></div>
        </div>
    </div>

    <script>
        const AUTH = 'rVK1jp0CUWH1vyZ39gfJ6oH6XXHdvIIU';
        const audio = new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg');
        let isAudioEnabled = false;

        function enableAudio() {
            isAudioEnabled = true;
            const btn = document.querySelector('.btn-audio');
            btn.innerText = "✅ Suara Aktif";
            btn.style.background = "#27ae60";
        }

        function updateData() {
            const url = 'https://blynk.cloud/external/api/get?token=' + AUTH + '&v0&v1&v2';
            
            fetch(url)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('v1').innerText = data.v1 ?? '0';
                    document.getElementById('v2').innerText = data.v2 ?? '0';

                    if (data.v0 == 1) {
                        document.getElementById('v0').innerText = "BAHAYA!";
                        document.getElementById('card-alert').className = "card danger";
                        if (isAudioEnabled) audio.play();
                    } else {
                        document.getElementById('v0').innerText = "AMAN";
                        document.getElementById('card-alert').className = "card";
                    }
                })
                .catch(err => console.error('Gagal mengambil data:', err));
        }

        setInterval(updateData, 2000);
        updateData();
    </script>
</body>
</html>
