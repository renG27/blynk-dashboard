<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blynk Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; width: 100%; max-width: 900px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        h3 { margin: 0 0 10px 0; color: #333; }
        .value { font-size: 36px; font-weight: bold; color: #007bff; }
        .unit { font-size: 18px; color: #666; margin-left: 5px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <h3>Alert Status</h3>
            <div class="value" id="v0">-</div>
        </div>
        <div class="card">
            <h3>Water Level</h3>
            <div class="value"><span id="v1">-</span><span class="unit">cm</span></div>
        </div>
        <div class="card">
            <h3>Jarak Sensor</h3>
            <div class="value"><span id="v2">-</span><span class="unit">cm</span></div>
        </div>
    </div>

    <script>
        const AUTH_TOKEN = 'rVK1jp0CUWH1vyZ39gfJ6oH6XXHdvIIU';

        function updateDashboard() {
            const url = 'https://blynk.cloud/external/api/get?token=' + AUTH_TOKEN + '&v0&v1&v2';
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('v0').innerText = data.v0 ?? '-';
                    document.getElementById('v1').innerText = data.v1 ?? '-';
                    document.getElementById('v2').innerText = data.v2 ?? '-';
                })
                .catch(error => console.error('Gagal mengambil data:', error));
        }

        updateDashboard();
        setInterval(updateDashboard, 3000);
    </script>

</body>
</html>
